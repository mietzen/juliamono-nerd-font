name: Patch Font

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'juliamono version'
        required: true
        default: 'v0.054'
        type: string
  repository_dispatch:
    types: [new-release-published]

jobs:
  patch:
    name: "Patch nerdfonts into juliamono"
    runs-on: ubuntu-26.04
    env:
      version: ${{ github.event.client_payload.version || inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: juliamono-nerd-font

      - uses: actions/checkout@v7
        with:
          repository: 'cormullion/juliamono'
          ref: ${{ env.version }}
          path: juliamono

      - name: Patch
        run: |
          mkdir -p font
          docker run --rm -v `pwd`/juliamono:/in -v `pwd`/font:/out nerdfonts/patcher --complete --careful --no-progressbars
          docker run --rm -v `pwd`/juliamono:/in -v `pwd`/font:/out nerdfonts/patcher --complete --careful --no-progressbars --mono
          # rename original files and use the filename-based naming scheme to create the forced (non-careful) version
          # nerdfonts/patcher lacks an option to specify a custom font name suffix, so this is the next best thing
          # --makegroups 4 helps shorten the resulting names: Nerd Fonts -> NF
          for file in juliamono/JuliaMono-*; do
            mv "$file" "juliamono/JuliaMonoForced-${file#*-}"
          done
          docker run --rm -v `pwd`/juliamono:/in -v `pwd`/font:/out nerdfonts/patcher --complete --name filename --makegroups 4 --no-progressbars
          docker run --rm -v `pwd`/juliamono:/in -v `pwd`/font:/out nerdfonts/patcher --complete --name filename --makegroups 4 --no-progressbars --mono

      - name: Archive Patched Fonts
        uses: actions/upload-artifact@v7
        with:
          name: patched-fonts
          path: font/*
          retention-days: 14

      - name: Zip Release Artifacts
        run: |
          zip -j fonts.zip font/*

      - name: Update download link in README.md
        run: |
          cd juliamono-nerd-font
          sed -i 's/releases\/download\/v[0-9.]\+/releases\/download\/${{ env.version }}/g' README.md

      - uses: actions/create-github-app-token@v3
        id: merge-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.merge-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}

      - name: Create Pull Request and Auto Merge
        id: pr
        working-directory: juliamono-nerd-font
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: |
          BRANCH="auto-update"
          git config --global user.name '${{ steps.merge-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.merge-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Updated juliamono-nerd-font to ${{ env.version }}"
          git push -u origin "$BRANCH" --force
          PR_URL=$(gh pr create \
            --title "[Merger Bot] Release ${{ env.version }}" \
            --body "Updated juliamono-nerd-font to ${{ env.version }}" \
            --label "automated pr" \
            --label "update")
          gh pr merge --squash --auto "$PR_URL"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        if: steps.pr.outputs.created == 'true'
        id: approve-token
        with:
          client-id: ${{ secrets.APP_ID_APPROVE }}
          private-key: ${{ secrets.APP_PRIVATE_KEY_APPROVE }}

      - name: Auto approve
        if: steps.pr.outputs.created == 'true'
        working-directory: juliamono-nerd-font
        env:
          GH_TOKEN: ${{ steps.approve-token.outputs.token }}
        run: |
          gh pr review --approve "auto-update"

      - name: Create Release
        if: steps.pr.outputs.created == 'true'
        working-directory: juliamono-nerd-font
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
        run: |
          gh release create ${{ env.version }} ../fonts.zip --generate-notes
